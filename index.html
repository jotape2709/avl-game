<aside><div class="brand"><i data-i="tree"></i>Arbor<span>Lab</span></div><div class="sideLabel">ESTUDO</div><nav><button data-page="arena"><i data-i="target"></i>Arena de treino</button><button data-page="lab"><i data-i="flask"></i>Laboratório livre</button><button data-page="progress"><i data-i="chart"></i>Meu progresso</button></nav><div class="sfoot"><div class="avatar">JP</div><div>Área de estudo<small>Progresso local</small></div></div></aside>
<main><header><div>Workspace <span>/</span> <b id="crumb"></b></div><div class="xp"><i data-i="bolt"></i><strong id="xp"></strong> XP</div></header><article id="app"></article></main><script>const height = n => n ? 1 + Math.max(height(n.l), height(n.r)) : 0;
const fb = n => height(n.l) - height(n.r);
function turn(n, left) {
  const near = left ? 'r' : 'l', far = left ? 'l' : 'r', pivot = n[near];
  n[near] = pivot[far]; pivot[far] = n; return pivot;
}
function rotationCase(n) {
  if (fb(n)>1) return fb(n.l)>=0 ? 0 : 2;
  if (fb(n)<-1) return fb(n.r)<=0 ? 1 : 3;
  return -1;
}
function insert(n, v, avl=false, log=[]) {
  if (!n) return {v,l:null,r:null};
  if (n.v===v) return n;
  const side = v<n.v?'l':'r';
  log.push(v+' '+(side==='l'?' < ':' > ')+n.v+' · '+(side==='l'?'esquerda':'direita'));
  n[side]=insert(n[side],v,avl,log);
  const c=avl?rotationCase(n):-1;
  if(c<0) return n;
  if(c===2) n.l=turn(n.l,true);
  if(c===3) n.r=turn(n.r,false);
  return turn(n,c===1||c===3);
}
function walk(n,order='em-ordem') {
  if(!n) return [];
  const left=walk(n.l,order), right=walk(n.r,order);
  if(order==='pré-ordem') return [n,...left,...right];
  if(order==='pós-ordem') return [...left,...right,n];
  return [...left,n,...right];
}
function shuffle(values) {
  const a=[...values];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
const numbers=n=>shuffle(Array.from({length:90},(_,i)=>i+10)).slice(0,n);
const build=(values,avl=false)=>values.reduce((n,v)=>insert(n,v,avl),null);
const rules={'pré-ordem':'Raiz, esquerda, direita.','em-ordem':'Esquerda, raiz, direita.','pós-ordem':'Esquerda, direita, raiz.'};
const topics=['Percursos','Inserção BST','Alturas e fatores','Reconhecer AVL','Busca na BST','Menor e maior na BST','Altura da subárvore','Comparar os lados','Equilíbrio de um nó'];
function question(topic,first=false){
  let vals=numbers(first?7:pick([5,6,7,8,9])), tree=build(vals,first||Math.random()<0.45);
  let title,hint,answer,choices,explain,focus=null,after=null,trace=[];
  if(topic===0){
    const order=pick(Object.keys(rules)), list=o=>walk(tree,o).map(n=>n.v);
    trace=list(order); answer=trace.join(' · '); title='Qual é o percurso em '+order+'?';
    hint=rules[order]+' Aplique essa regra de novo em cada subárvore.';
    const opts=new Set([answer,...Object.keys(rules).map(o=>list(o).join(' · ')),[...trace].reverse().join(' · ')]);
    while(opts.size<4) opts.add(shuffle(trace).join(' · '));
    choices=[...opts].slice(0,4); explain=rules[order]+' A visita começa em '+trace[0]+' e termina em '+trace.at(-1)+'.';
  }else if(topic===1){
    const v=numbers(15).find(x=>!vals.includes(x)); let n=tree;
    for(;;){trace.push(n.v);const side=v<n.v?'l':'r';if(!n[side])break;n=n[side];}
    const side=v<n.v?'esquerda':'direita';answer='À '+side+' de '+n.v;title='Onde entra o valor '+v+'?';
    choices=[answer,'À '+(side==='esquerda'?'direita':'esquerda')+' de '+n.v,...['esquerda','direita'].map(s=>'À '+s+' de '+vals.find(x=>x!==n.v))];
    hint='Comece pela raiz. Um valor menor segue à esquerda e um maior segue à direita.';
    explain='Caminho de comparação: '+trace.join(' → ')+'. O primeiro espaço livre fica à '+side+' de '+n.v+'.';after=insert(structuredClone(tree),v);
  }else if(topic===2){
    const n=pick(walk(tree).filter(n=>n.l||n.r));focus=n.v; answer=String(fb(n));
    choices=[answer,...shuffle([-4,-3,-2,-1,0,1,2,3,4].map(String).filter(x=>x!==answer)).slice(0,3)];
    title='Qual é o fator de balanceamento do nó '+n.v+'?';hint='Conte os nós do caminho mais longo de cada lado. Subárvore vazia tem altura zero.';
    explain='Em '+n.v+', a esquerda tem altura '+height(n.l)+' e a direita tem altura '+height(n.r)+'. FB = '+height(n.l)+' − '+height(n.r)+' = '+fb(n)+'.';
  }else if(topic===3){
    const bad=walk(tree).filter(n=>Math.abs(fb(n))>1);answer=bad.length?'Não':'Sim';choices=['Sim','Não'];title='Esta BST também é uma AVL?';hint='Confira todos os nós. Cada fator precisa estar entre −1 e +1.';
    explain=bad.length?'Nós desequilibrados: '+bad.map(n=>n.v+' (FB '+fb(n)+')').join(', ')+'.':'Todos os nós têm FB igual a −1, 0 ou +1.';focus=bad[0]?.v;
  }else if(topic===4){
    const target=pick(walk(tree).filter(n=>n!==tree)); let n=tree;
    while(n){trace.push(n.v);if(n===target)break;n=target.v<n.v?n.l:n.r;}
    title='Qual nó vem logo antes de '+target.v+' na busca pela raiz?';
    answer=String(trace.at(-2));choices=nodeOptions(tree,answer);
    hint='Compare o valor procurado com cada nó. Menor segue à esquerda, maior à direita.';
    explain='A busca visita '+trace.join(' → ')+'. O penúltimo nó é '+answer+'.';
  }else if(topic===5){
    const min=Math.random()<0.5,side=min?'l':'r';let n=tree;
    while(n){trace.push(n.v);n=n[side];}
    title='Qual é o '+(min?'menor':'maior')+' valor desta BST?';
    answer=String(trace.at(-1));choices=nodeOptions(tree,answer);
    hint='A partir da raiz, siga sempre à '+(min?'esquerda':'direita')+'.';
    explain='O caminho é '+trace.join(' → ')+'. O último nó contém o extremo procurado.';
  }else if(topic===6){
    const n=pick(walk(tree).filter(n=>n.l||n.r)),side=pick(['l','r']),name=side==='l'?'esquerda':'direita';
    focus=n.v;title='Qual é a altura da subárvore '+name+' de '+n.v+', contando nós?';
    let child=n[side];
    while(child){trace.push(child.v);child=height(child.l)>=height(child.r)?child.l:child.r;}
    answer=String(height(n[side]));choices=[answer,...shuffle(Array.from({length:9},(_,i)=>String(i)).filter(x=>x!==answer)).slice(0,3)];
    hint='Comece no filho do lado pedido. Conte os nós até a folha mais distante. Um lado vazio vale zero.';
    explain=trace.length?'Um caminho mais longo desse lado é '+trace.join(' → ')+'. Ele tem '+answer+' nó(s).':'Esse lado está vazio, por isso a altura é 0.';
  }else if(topic===7||topic===8){
    const n=pick(walk(tree).filter(n=>n.l||n.r));focus=n.v;
    const delta=fb(n),detail='Em '+n.v+', altura esquerda = '+height(n.l)+' e altura direita = '+height(n.r)+'. FB = '+height(n.l)+' − '+height(n.r)+' = '+delta+'.';
    if(topic===7){
      title='Qual lado do nó '+n.v+' tem maior altura?';
      choices=['Esquerdo','Direito','As alturas são iguais'];answer=choices[delta>0?0:delta<0?1:2];
      hint='Compare o caminho mais longo à esquerda com o mais longo à direita.';
      explain=detail+' '+(delta===0?'As alturas são iguais.':'O lado '+answer.toLowerCase()+' é mais alto.');
    }else{
      title='O nó '+n.v+' satisfaz a condição de equilíbrio da AVL?';
      choices=['Sim','Não'];answer=Math.abs(delta)<=1?'Sim':'Não';
      hint='Analise apenas o nó marcado. As duas alturas podem diferir em até um.';
      explain=detail+' A diferença absoluta é '+Math.abs(delta)+'. O limite permitido é 1.';
    }
  }
  return {topic,tree,title,hint,answer,choices:shuffle(choices),explain,focus,after,trace};
}

function nodeOptions(tree,answer){
  const others=walk(tree).map(n=>String(n.v)).filter(v=>v!==answer);
  return [answer,...shuffle(others).slice(0,3)];
}

const icon=k=>'<i data-i="'+k+'" aria-hidden="true"></i>';
function icons(){document.querySelectorAll('i[data-i]').forEach(i=>i.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+paths[i.dataset.i]+'"/></svg>');}
const pages={arena:'Arena de treino',lab:'Laboratório livre',progress:'Meu progresso'};
let stats={total:0,hits:0,streak:0,best:0,by:topics.map(()=>[0,0])};
try{const s=JSON.parse(localStorage.getItem('arbor-v1'));if(s&&Array.isArray(s.by)){const legacy=s.by.length===5;stats={...s,by:topics.map((_,i)=>(legacy&&i>=4?null:s.by[i])||[0,0])};}}catch{}
let page='arena',filter=-1,q=question(0,true),round=1,selected=null,done=false,hinted=false,showAfter=false,step=-1;
let labValues=numbers(7),labAVL=true,labRoot=build(labValues,true),labLog='Árvore inicial gerada.',inspect=null;
const app=document.querySelector('#app');
function board(root,focus=null,interactive=false,kind='BST'){
 const ordered=walk(root),h=height(root),w=Math.max(360,ordered.length*46+40),dh=Math.max(220,h*64+36);
 const pos=new Map();function locate(n,d){if(!n)return;pos.set(n,{x:25+(ordered.indexOf(n)+.5)*(w-50)/ordered.length,y:(dh-(h-1)*64)/2+d*64});locate(n.l,d+1);locate(n.r,d+1);}locate(root,0);
 let lines='',nodes='';for(const n of ordered){const {x,y}=pos.get(n);for(const c of [n.l,n.r].filter(Boolean)){const p=pos.get(c);lines+='<line x1="'+x+'" y1="'+y+'" x2="'+p.x+'" y2="'+p.y+'" stroke="#a797c4" stroke-width="2.3"/>';}
 const mark=n.v===focus,base=n===root,col=mark?'#56328e':base?'#7850b6':'#fff';
 nodes+='<g '+(interactive?'tabindex="0" role="button" data-node="'+n.v+'" aria-label="Inspecionar nó '+n.v+'" style="cursor:pointer"':'')+'><title>Nó '+n.v+'</title>'+(mark?'<circle cx="'+x+'" cy="'+y+'" r="24" fill="none" stroke="#ba9be4" stroke-width="2"/>':'')+'<circle cx="'+x+'" cy="'+y+'" r="18" fill="'+col+'" stroke="'+(base||mark?'#6b43a6':'#a591bd')+'" stroke-width="2"/><text x="'+x+'" y="'+(y+5.5)+'" text-anchor="middle" font-size="16" fill="'+(base||mark?'white':'#453552')+'">'+n.v+'</text></g>';}
 return '<section class="card"><div class="cardhead"><h2>'+icon('tree')+'Visualização da árvore</h2><span class="tag">'+kind+'</span></div><div class="board">'+(root?'<svg style="min-width:'+Math.min(w,w*.76)+'px" viewBox="0 0 '+w+' '+dh+'" role="group" aria-label="Árvore com raiz '+root.v+'">'+lines+nodes+'</svg>':'<p style="text-align:center">Insira um valor para criar a raiz.</p>')+'</div><div class="boardfoot"><span class="key">Raiz</span><span class="key other">Nó</span><span style="margin-left:auto">'+ordered.length+' nós</span></div></section>';
}
const button=(act,label,cls='action',extra='')=>'<button class="'+cls+'" data-act="'+act+'" '+extra+'>'+label+'</button>';
function pageHeading(label,title,sub,control=''){return '<div class="eyebrow">'+label+'</div><div class="top"><div><h1>'+title+'</h1><p>'+sub+'</p></div>'+control+'</div>';}
function statCards(){return '<div class="stats">'+[['target','Questões',stats.total],['fire','Sequência',stats.streak],['chart','Precisão',stats.total?Math.round(100*stats.hits/stats.total)+'%':'—']].map(([ic,k,v])=>'<div class="stat">'+icon(ic)+'<div><small>'+k+'</small><strong>'+v+'</strong></div></div>').join('')+'</div>';}
function arena(){
 const filterUI='<select aria-label="Tema dos desafios" id="topic"><option value="-1">Todos os temas</option>'+topics.map((t,i)=>'<option value="'+i+'" '+(i===filter?'selected':'')+'>'+t+'</option>').join('')+'</select>';
 const target=step>=0?q.trace[step]:q.topic===3&&!done?null:q.focus;
 const opts=q.choices.map((c,i)=>button('choose', '<b>'+String.fromCharCode(65+i)+'</b>'+c,'opt '+(done&&c===q.answer?'good':done&&c===selected?'bad':selected===c?'sel':''),'data-index="'+i+'" aria-pressed="'+(selected===c)+'" '+(done?'disabled':''))).join('');
 return pageHeading('ESTRUTURA DE DADOS',pages.arena,'Resolva desafios com árvores geradas a cada rodada.',filterUI)+statCards()+'<div class="game"><div>'+board(showAfter?q.after:q.tree,target,false,'BST')+(done&&q.after?button('after',showAfter?'Ver antes':'Ver árvore depois','action below'):'')+(done&&q.trace.length?'<div class="note">'+button('trace','Visitar próximo nó')+' '+(step>=0?'Passo '+(step+1)+' de '+q.trace.length+' · nó '+q.trace[step]:'Percorra a solução nó por nó.')+'</div>':'')+'</div><section class="card pad"><div class="panelTitle">'+icon('target')+' DESAFIO '+String(round).padStart(2,'0')+' · '+topics[q.topic].toUpperCase()+'</div><h3>'+q.title+'</h3>'+opts+(done?'<div role="status" class="feedback"><b>'+(selected===q.answer?'Acertou! +10 XP':'Resposta correta: '+q.answer)+'</b><br>'+q.explain+'</div>'+button('next','Próximo desafio','primary wide'):button('verify',icon('check')+'Conferir resposta','primary wide',selected===null?'disabled':'')+button('hint',hinted?'Ocultar dica':'Preciso de uma dica','link')+(hinted?'<div class="note">'+q.hint+'</div>':''))+'</section></div>';
}
function lab(){
 const n=walk(labRoot).find(n=>n.v===inspect);
 return pageHeading('EXPERIMENTAÇÃO',pages.lab,'Insira valores e compare a mesma sequência em BST e AVL.',button('random',icon('shuffle')+'Sortear árvore'))+'<div class="game"><div>'+board(labRoot,inspect,true,labAVL?'AVL':'BST')+'<p class="note">'+(n?'Nó '+n.v+' · altura esquerda '+height(n.l)+' · altura direita '+height(n.r)+' · FB = '+height(n.l)+' − '+height(n.r)+' = '+fb(n):'Selecione um nó para comparar as alturas das suas subárvores.')+'</p></div><section class="card pad"><div class="panelTitle">'+icon('flask')+' CONTROLES</div><h3>Construa sua árvore</h3><div class="group"><label for="mode">Tipo de árvore</label><select id="mode"><option value="AVL">AVL · balanceamento automático</option><option '+(!labAVL?'selected':'')+' value="BST">BST · inserção simples</option></select></div><form id="insertForm" class="group"><label for="val">Valor inteiro (−99 a 999)</label><div class="wrap"><input type="number" required min="-99" max="999" id="val" placeholder="Ex. 42"><button class="primary">Inserir</button></div></form><div class="wrap">'+button('undo','Desfazer','action',labValues.length?'':'disabled')+button('clear','Esvaziar','action',labValues.length?'':'disabled')+'</div><p class="note" role="status">'+labLog+'</p><small>Ordem de inserção</small><p>'+ (labValues.join(' · ')||'Árvore vazia')+'</p></section></div>';
}
function progressPage(){return pageHeading('HISTÓRICO LOCAL',pages.progress,'Acompanhe seus acertos por assunto neste navegador.')+statCards()+'<section class="card pad"><div class="panelTitle">'+icon('chart')+' DESEMPENHO</div><h3>Acertos por tema</h3>'+topics.map((t,i)=>{const [all,correct]=stats.by[i];return '<div class="history"><div class="row"><strong>'+t+'</strong><small>'+correct+' de '+all+'</small></div><div class="track"><span style="width:'+(all?100*correct/all:0)+'%"></span></div></div>';}).join('')+'<p>Melhor sequência: '+stats.best+' acertos seguidos.</p></section>';}
function render(){document.querySelector('#crumb').textContent=pages[page];document.querySelector('#xp').textContent=stats.hits*10;document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.setAttribute('aria-label',pages[b.dataset.page]);});app.innerHTML=page==='arena'?arena():page==='lab'?lab():progressPage();icons();}
let topicBag=shuffle(topics.map((_,i)=>i).slice(1));
function next(){round++;if(!topicBag.length)topicBag=shuffle(topics.map((_,i)=>i));q=question(filter<0?topicBag.pop():filter);selected=null;done=false;hinted=false;showAfter=false;step=-1;}
function rebuild(msg){labRoot=build(labValues,labAVL);inspect=null;labLog=msg;}
document.addEventListener('click',e=>{
 const b=e.target.closest('button,[data-node]');if(!b)return;
 if(b.dataset.page){page=b.dataset.page;render();return;}
 if(b.dataset.node!==undefined){inspect=Number(b.dataset.node);render();return;}
 switch(b.dataset.act){
 case 'choose':if(!done)selected=q.choices[Number(b.dataset.index)];break;
 case 'hint':hinted=!hinted;break;
 case 'verify':if(done||selected===null)return;done=true;stats.total++;stats.by[q.topic][0]++;if(selected===q.answer){stats.hits++;stats.by[q.topic][1]++;stats.streak++;}else stats.streak=0;stats.best=Math.max(stats.best,stats.streak);try{localStorage.setItem('arbor-v1',JSON.stringify(stats));}catch{}break;
 case 'next':next();break;case 'after':showAfter=!showAfter;break;case 'trace':step=(step+1)%q.trace.length;break;
 case 'undo':labValues.pop();rebuild('Última inserção desfeita.');break;
 case 'clear':labValues=[];rebuild('Árvore vazia. O próximo valor será a raiz.');break;
 case 'random':labValues=numbers(pick([5,6,7,8]));rebuild('Nova sequência sorteada.');break;
 default:return;
 }render();
});
document.addEventListener('keydown',e=>{if(e.target.hasAttribute('data-node')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});
document.addEventListener('change',e=>{if(e.target.id==='topic'){filter=Number(e.target.value);next();render();}if(e.target.id==='mode'){labAVL=e.target.value==='AVL';rebuild('Mesma sequência reconstruída em '+e.target.value+'.');render();}});
document.addEventListener('submit',e=>{if(e.target.id!=='insertForm')return;e.preventDefault();const v=document.querySelector('#val').valueAsNumber,log=[];if(!Number.isInteger(v)||v< -99||v>999)return;
 if(labValues.includes(v))labLog='O valor '+v+' já está na árvore.';
 else if(labValues.length>=24)labLog='Limite visual de 24 nós. Desfaça uma inserção ou esvazie a árvore.';
 else{labValues.push(v);labRoot=insert(labRoot,v,labAVL,log);inspect=v;labLog=(log.length?log.join('<br>')+'<br>':'')+'Valor '+v+' inserido.';}render();document.querySelector('#val').focus();});
render();
</script></body></html>
